<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel Example</title>
  </head>

  <body>
    <div class="slide-container">
      <div class="slide fade">
        <div class="number-text">1 / 6</div>
        <img src="img/cinderace.jpg" alt="" />
        <div class="caption">Cinderace</div>
      </div>
      <div class="slide fade">
        <div class="number-text">2 / 6</div>
        <img src="img/quagsire.jpg" alt="" />
        <div class="caption">Quagsire</div>
      </div>
      <div class="slide fade">
        <div class="number-text">3 / 6</div>
        <img src="img/persian-alolan.jpg" alt="" />
        <div class="caption">Dark Persian</div>
      </div>
      <div class="slide fade">
        <div class="number-text">4 / 6</div>
        <img src="img/reuniclus.jpg" alt="" />
        <div class="caption">Reuniclus</div>
      </div>
      <div class="slide fade">
        <div class="number-text">5 / 6</div>
        <img src="img/togedemaru.jpg" alt="" />
        <div class="caption">Togedemaru</div>
      </div>
      <div class="slide fade">
        <div class="number-text">6 / 6</div>
        <img src="img/lickilicky.jpg" alt="" />
        <div class="caption">Lickilicky</div>
      </div>
      <a class="previous">&#10094;</a><a class="next">&#10095;</a>
    </div>
    <br />
    <div class="dot-container">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span
      ><span class="dot"></span><span class="dot"></span
      ><span class="dot"></span>
    </div>
  </body>
</html>
